<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574"/>
      <stop offset="100%" style="stop-color:#8B4513"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#grad)"/>
  <!-- Georgian letter frame -->
  <rect x="80" y="80" width="352" height="352" rx="40" fill="#FAF8F5" opacity="0.95"/>
  <!-- Georgian letters (stylized) -->
  <text x="256" y="300" font-family="Noto Sans Georgian, Arial, sans-serif" font-size="180" font-weight="600" fill="#8B4513" text-anchor="middle">ქარ</text>
  <!-- Bottom accent -->
  <rect x="140" y="380" width="232" height="8" rx="4" fill="#8B4513" opacity="0.6"/>
</svg>
