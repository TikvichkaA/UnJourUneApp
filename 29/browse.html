<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictionnaire - Traducteur Antifasciste</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 450px;
      max-height: 600px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #dc2626;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .header .back {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header .back:hover {
      background: rgba(255,255,255,0.3);
    }

    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }

    .search-bar {
      padding: 12px 16px;
      background: #222;
      flex-shrink: 0;
    }

    .search-input {
      width: 100%;
      padding: 10px 12px;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
    }

    .search-input:focus {
      outline: none;
      border-color: #dc2626;
    }

    .filters {
      display: flex;
      gap: 6px;
      padding: 8px 16px;
      background: #222;
      overflow-x: auto;
      flex-shrink: 0;
    }

    .filter-btn {
      padding: 6px 12px;
      background: #333;
      border: none;
      border-radius: 20px;
      color: #888;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      background: #444;
      color: #fff;
    }

    .filter-btn.active {
      background: #dc2626;
      color: #fff;
    }

    .list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .item {
      padding: 12px;
      background: #2a2a2a;
      border-radius: 6px;
      margin-bottom: 8px;
      cursor: default;
      transition: background 0.2s;
    }

    .item:hover {
      background: #333;
    }

    .item-original {
      font-weight: 600;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .item-category {
      font-size: 10px;
      padding: 2px 6px;
      background: #444;
      border-radius: 3px;
      color: #888;
    }

    .item-translation {
      color: #dc2626;
      font-size: 13px;
      line-height: 1.4;
    }

    .empty {
      padding: 40px;
      text-align: center;
      color: #666;
    }

    .count {
      padding: 8px 16px;
      background: #222;
      font-size: 11px;
      color: #666;
      text-align: center;
      flex-shrink: 0;
    }

    /* Categories colors */
    .cat-immigration { border-left: 3px solid #3b82f6; }
    .cat-ordre { border-left: 3px solid #ef4444; }
    .cat-tradition { border-left: 3px solid #8b5cf6; }
    .cat-economie { border-left: 3px solid #22c55e; }
    .cat-medias { border-left: 3px solid #f59e0b; }
    .cat-nationalisme { border-left: 3px solid #ec4899; }
    .cat-general { border-left: 3px solid #6b7280; }
  </style>
</head>
<body>
  <header class="header">
    <button class="back" id="backBtn" title="Retour">&larr;</button>
    <h1>Dictionnaire collaboratif</h1>
  </header>

  <div class="search-bar">
    <input type="text" class="search-input" id="searchInput"
           placeholder="Rechercher une expression...">
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all">Tout</button>
    <button class="filter-btn" data-filter="immigration">Immigration</button>
    <button class="filter-btn" data-filter="ordre">Ordre</button>
    <button class="filter-btn" data-filter="tradition">Tradition</button>
    <button class="filter-btn" data-filter="economie">Économie</button>
    <button class="filter-btn" data-filter="medias">Médias</button>
    <button class="filter-btn" data-filter="nationalisme">Nationalisme</button>
  </div>

  <div class="count" id="countDisplay">Chargement...</div>

  <div class="list" id="list"></div>

  <script src="config.js"></script>
  <script src="translations.js"></script>
  <script src="api.js"></script>
  <script>
    let allTranslations = [];
    let currentFilter = 'all';
    let searchQuery = '';

    document.getElementById('backBtn').addEventListener('click', () => {
      window.location.href = 'popup.html';
    });

    // Charger les traductions
    async function loadTranslations() {
      try {
        allTranslations = await TranslationsAPI.fetchTranslations();
      } catch (e) {
        allTranslations = TRANSLATIONS || [];
      }
      renderList();
    }

    // Filtrer et afficher
    function renderList() {
      const list = document.getElementById('list');
      const countDisplay = document.getElementById('countDisplay');

      let filtered = allTranslations;

      // Filtrer par catégorie
      if (currentFilter !== 'all') {
        filtered = filtered.filter(t => t.category === currentFilter);
      }

      // Filtrer par recherche
      if (searchQuery) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(t =>
          t.original.toLowerCase().includes(q) ||
          t.translation.toLowerCase().includes(q)
        );
      }

      // Trier alphabétiquement
      filtered.sort((a, b) => a.original.localeCompare(b.original));

      countDisplay.textContent = `${filtered.length} expression${filtered.length > 1 ? 's' : ''}`;

      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty">Aucune expression trouvée</div>';
        return;
      }

      list.innerHTML = filtered.map(t => `
        <div class="item cat-${t.category}">
          <div class="item-original">
            ${t.original}
            <span class="item-category">${t.category}</span>
          </div>
          <div class="item-translation">${t.translation}</div>
        </div>
      `).join('');
    }

    // Filtres
    document.getElementById('filters').addEventListener('click', (e) => {
      if (e.target.classList.contains('filter-btn')) {
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        renderList();
      }
    });

    // Recherche
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderList();
    });

    // Init
    loadTranslations();
  </script>
</body>
</html>
