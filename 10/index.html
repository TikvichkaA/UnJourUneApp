<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SubTracker - Suivi des subventions associatives</title>
  <meta name="description" content="Plateforme de suivi complet des subventions et du financement associatif">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components/sidebar.css">
  <link rel="stylesheet" href="css/components/kanban.css">
  <link rel="stylesheet" href="css/components/calendar.css">
  <link rel="stylesheet" href="css/components/modal.css">
  <link rel="stylesheet" href="css/components/charts.css">
  <link rel="stylesheet" href="css/components/table.css">
  <link rel="stylesheet" href="css/components/forms.css">
  <link rel="stylesheet" href="css/components/financeurs.css">
  <link rel="stylesheet" href="css/components/editable-table.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

  <!-- Mobile sidebar toggle -->
  <button class="sidebar-toggle" id="sidebarToggle">&#9776;</button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="app-layout" id="appLayout">

    <!-- ====== Sidebar ====== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="#dashboard" class="sidebar-logo">
          <div class="sidebar-logo-icon">ST</div>
          <div class="sidebar-logo-text">Sub<span>Tracker</span></div>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section">
          <div class="sidebar-section-title">Principal</div>
          <a href="#dashboard" class="sidebar-link" data-route="dashboard">
            <span class="sidebar-icon">&#9633;</span> Tableau de bord
          </a>
          <a href="#subventions" class="sidebar-link" data-route="subventions">
            <span class="sidebar-icon">&#8364;</span> Financements
          </a>
          <a href="#financeurs" class="sidebar-link" data-route="financeurs">
            <span class="sidebar-icon">&#127970;</span> Financeurs
          </a>
          <a href="#projects" class="sidebar-link" data-route="projects">
            <span class="sidebar-icon">&#9881;</span> Projets
          </a>
          <a href="#calendar" class="sidebar-link" data-route="calendar">
            <span class="sidebar-icon">&#128197;</span> Calendrier
          </a>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-section-title">Outils</div>
          <a href="#discovery" class="sidebar-link" data-route="discovery">
            <span class="sidebar-icon">&#128269;</span> Découvrir AAP
          </a>
          <a href="#reports" class="sidebar-link" data-route="reports">
            <span class="sidebar-icon">&#128196;</span> Rapports
          </a>
          <a href="#tableaux" class="sidebar-link" data-route="tableaux">
            <span class="sidebar-icon">&#9638;</span> Tableaux
          </a>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-section-title">Compte</div>
          <a href="#settings" class="sidebar-link" data-route="settings">
            <span class="sidebar-icon">&#9881;</span> Paramètres
          </a>
        </div>
      </nav>

      <div class="sidebar-footer" id="sidebarFooter">
        <!-- User info injected by JS -->
      </div>
    </aside>

    <!-- ====== Main Content ====== -->
    <main class="main-content" id="mainContent">
      <div class="loading-spinner" id="appLoader"></div>
    </main>

  </div>

  <!-- ====== Auth Modal ====== -->
  <div class="modal-overlay" id="authModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="authModalTitle">Connexion</h3>
        <button class="modal-close" id="authModalClose">&times;</button>
      </div>
      <div class="modal-body">
        <form id="authForm">
          <div class="form-group" id="authNameGroup" style="display:none">
            <label class="form-label" for="authName">Nom de l'association</label>
            <input type="text" id="authName" class="form-input" placeholder="Mon Association">
          </div>
          <div class="form-group">
            <label class="form-label" for="authEmail">Email</label>
            <input type="email" id="authEmail" class="form-input" placeholder="contact@association.org" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="authPassword">Mot de passe</label>
            <input type="password" id="authPassword" class="form-input" placeholder="Min. 6 caractères" required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg" style="width:100%" id="authSubmitBtn">Se connecter</button>
        </form>
        <div class="auth-toggle">
          <span id="authToggleText">Pas encore de compte ?</span>
          <a id="authToggleLink"> Créer un compte</a>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== Generic Modal Container ====== -->
  <div class="modal-overlay" id="genericModal">
    <div class="modal" id="genericModalContent" style="max-width:600px">
    </div>
  </div>

  <!-- ====== Slide Panel Container ====== -->
  <div class="slide-panel-overlay" id="slidePanelOverlay"></div>
  <div class="slide-panel" id="slidePanel">
    <div class="slide-panel-content" id="slidePanelContent"></div>
  </div>

  <!-- ====== Toast container ====== -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ====== Scripts ====== -->
  <!-- Config & Auth (kept) -->
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-auth.js"></script>

  <!-- AI services (kept) -->
  <script src="js/ai-service.js"></script>
  <script src="js/recommendation.js"></script>

  <!-- Utilities -->
  <script src="js/utils/dates.js"></script>
  <script src="js/utils/currency.js"></script>
  <script src="js/utils/pdf-export.js"></script>
  <script src="js/utils/csv-export.js"></script>

  <!-- Services -->
  <script src="js/services/supabase-data.js"></script>
  <script src="js/services/supabase-storage.js"></script>
  <script src="js/services/calculations.js"></script>

  <!-- Components -->
  <script src="js/components/kanban.js"></script>
  <script src="js/components/charts.js"></script>
  <script src="js/components/slide-panel.js"></script>
  <script src="js/components/data-table.js"></script>
  <script src="js/components/file-upload.js"></script>
  <script src="js/components/editable-table.js"></script>

  <!-- Modules (views) -->
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/financeurs.js"></script>
  <script src="js/modules/subventions.js"></script>
  <script src="js/modules/projects.js"></script>
  <script src="js/modules/expenses.js"></script>
  <script src="js/modules/calendar-view.js"></script>
  <script src="js/modules/documents.js"></script>
  <script src="js/modules/discovery.js"></script>
  <script src="js/modules/reports.js"></script>
  <script src="js/modules/settings.js"></script>
  <script src="js/modules/tableview.js"></script>

  <!-- App (router + orchestrator) -->
  <script src="js/app.js"></script>
</body>
</html>
