<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6BB3D9"/>
      <stop offset="100%" stop-color="#87CEEB"/>
    </linearGradient>
    <linearGradient id="soil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d2e1f"/>
      <stop offset="50%" stop-color="#2a1f15"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE87C"/>
      <stop offset="60%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="rgba(255,200,50,0)"/>
    </radialGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="90" fill="#1a1510"/>

  <!-- Sky -->
  <clipPath id="clip">
    <rect x="0" y="0" width="512" height="512" rx="90"/>
  </clipPath>

  <g clip-path="url(#clip)">
    <!-- Sky -->
    <rect x="0" y="0" width="512" height="230" fill="url(#sky)"/>

    <!-- Sun -->
    <circle cx="400" cy="80" r="45" fill="url(#sun)"/>

    <!-- Soil -->
    <rect x="0" y="230" width="512" height="282" fill="url(#soil)"/>

    <!-- Surface line -->
    <rect x="0" y="230" width="512" height="4" fill="#5a4a35"/>

    <!-- Plants -->
    <g fill="#4a7c3f">
      <!-- Plant 1 -->
      <rect x="120" y="180" width="4" height="50" fill="#5d4037"/>
      <ellipse cx="108" cy="175" rx="15" ry="8" transform="rotate(-25 108 175)"/>
      <ellipse cx="132" cy="175" rx="15" ry="8" transform="rotate(25 132 175)"/>
      <ellipse cx="120" cy="165" rx="12" ry="7"/>

      <!-- Plant 2 -->
      <rect x="200" y="160" width="4" height="70" fill="#5d4037"/>
      <ellipse cx="185" cy="152" rx="18" ry="9" transform="rotate(-30 185 152)"/>
      <ellipse cx="215" cy="152" rx="18" ry="9" transform="rotate(30 215 152)"/>
      <ellipse cx="200" cy="140" rx="14" ry="8"/>

      <!-- Plant 3 -->
      <rect x="280" y="165" width="4" height="65" fill="#5d4037"/>
      <ellipse cx="267" cy="158" rx="16" ry="8" transform="rotate(-28 267 158)"/>
      <ellipse cx="293" cy="158" rx="16" ry="8" transform="rotate(28 293 158)"/>
      <ellipse cx="280" cy="148" rx="13" ry="7"/>

      <!-- Plant 4 -->
      <rect x="360" y="175" width="4" height="55" fill="#5d4037"/>
      <ellipse cx="348" cy="170" rx="14" ry="7" transform="rotate(-25 348 170)"/>
      <ellipse cx="372" cy="170" rx="14" ry="7" transform="rotate(25 372 170)"/>
      <ellipse cx="360" cy="162" rx="11" ry="6"/>
    </g>

    <!-- Roots -->
    <g stroke="#8B7355" stroke-width="2" fill="none" opacity="0.5">
      <line x1="122" y1="235" x2="115" y2="300"/>
      <line x1="122" y1="235" x2="130" y2="290"/>
      <line x1="202" y1="235" x2="190" y2="320"/>
      <line x1="202" y1="235" x2="215" y2="310"/>
      <line x1="282" y1="235" x2="270" y2="305"/>
      <line x1="282" y1="235" x2="295" y2="295"/>
      <line x1="362" y1="235" x2="355" y2="290"/>
      <line x1="362" y1="235" x2="370" y2="280"/>
    </g>

    <!-- Soil organisms -->
    <g opacity="0.6">
      <!-- Worms -->
      <ellipse cx="160" cy="320" rx="18" ry="4" fill="#C4A484"/>
      <ellipse cx="320" cy="380" rx="15" ry="3" fill="#D4B896"/>

      <!-- Microbes -->
      <circle cx="100" cy="280" r="5" fill="rgba(180, 200, 150, 0.6)"/>
      <circle cx="250" cy="350" r="4" fill="rgba(180, 200, 150, 0.5)"/>
      <circle cx="400" cy="300" r="5" fill="rgba(180, 200, 150, 0.6)"/>
      <circle cx="180" cy="400" r="4" fill="rgba(180, 200, 150, 0.5)"/>

      <!-- Fungal threads -->
      <line x1="140" y1="360" x2="180" y2="365" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
      <line x1="280" y1="420" x2="330" y2="415" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    </g>
  </g>
</svg>
